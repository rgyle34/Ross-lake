<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ross Lake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #1a3a5c, #0d1b2a);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 900px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #7dd3fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 50px;
        }

        .characters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .character-card {
            background: rgba(30, 58, 95, 0.6);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(5px);
        }

        .character-card:hover {
            transform: translateY(-8px);
            border-color: #38bdf8;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
            background: rgba(30, 58, 95, 0.85);
        }

        .character-card.selected {
            border-color: #22d3ee;
            background: rgba(8, 47, 73, 0.9);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.4);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
        }

        .clay { background: linear-gradient(135deg, #64748b, #475569); }
        .ryan { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
        .justin { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .bob { background: linear-gradient(135deg, #f59e0b, #d97706); }

        .name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .age {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        #startBtn {
            background: linear-gradient(90deg, #0ea5e9, #22d3ee);
            border: none;
            padding: 16px 50px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            border-radius: 50px;
            cursor: pointer;
            opacity: 0.4;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        #startBtn.active {
            opacity: 1;
            pointer-events: auto;
        }

        #startBtn.active:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.5);
        }

        .selected-info {
            margin-top: 25px;
            font-size: 1.1rem;
            color: #7dd3fc;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ROSS LAKE</h1>
        <div class="subtitle">Choose your angler</div>

        <div class="characters">
            <div class="character-card" data-name="Clay" data-age="Early 60s">
                <div class="avatar clay">C</div>
                <div class="name">Clay</div>
                <div class="age">Early 60s</div>
            </div>

            <div class="character-card" data-name="Ryan" data-age="40 years old">
                <div class="avatar ryan">R</div>
                <div class="name">Ryan</div>
                <div class="age">40 years old</div>
            </div>

            <div class="character-card" data-name="Justin" data-age="29 years old">
                <div class="avatar justin">J</div>
                <div class="name">Justin</div>
                <div class="age">29 years old</div>
            </div>

            <div class="character-card" data-name="Bob" data-age="79 years old">
                <div class="avatar bob">B</div>
                <div class="name">Bob</div>
                <div class="age">79 years old</div>
            </div>
        </div>

        <button id="startBtn">Start Fishing</button>
        <div class="selected-info" id="selectedInfo"></div>
    </div>

    <script>
        let selectedPlayer = null;

        const cards = document.querySelectorAll('.character-card');
        const startBtn = document.getElementById('startBtn');
        const selectedInfo = document.getElementById('selectedInfo');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Remove previous selection
                cards.forEach(c => c.classList.remove('selected'));
                
                // Select this one
                card.classList.add('selected');
                selectedPlayer = {
                    name: card.dataset.name,
                    age: card.dataset.age
                };

                // Update UI
                selectedInfo.textContent = `Selected: ${selectedPlayer.name} (${selectedPlayer.age})`;
                startBtn.classList.add('active');
            });
        });

        startBtn.addEventListener('click', () => {
            if (selectedPlayer) {
                // For now just show an alert. In Phase 2 this will go to the fishing screen.
                alert(`You selected ${selectedPlayer.name}!\n\nPhase 2 (the actual fishing) will start here next.`);
                
                // Later we will replace this with:
                // startFishingGame(selectedPlayer);
            }
        });
    </script>
</body>
</html>
